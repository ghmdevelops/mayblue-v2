<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="flow02">
  <!-- Mesmo gradiente da marca no cabeçalho: azul do acento ao verde do dinheiro. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cb0ff"/>
      <stop offset="1" stop-color="#4fd6a4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0c11"/>
  <!-- Barras crescentes: a ideia de ranking por retorno. -->
  <rect x="112" y="288" width="66" height="112" rx="20" fill="url(#g)" opacity=".55"/>
  <rect x="223" y="216" width="66" height="184" rx="20" fill="url(#g)" opacity=".78"/>
  <rect x="334" y="112" width="66" height="288" rx="20" fill="url(#g)"/>
</svg>
